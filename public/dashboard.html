<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Print Queue - Shopkeeper Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .job-slide { animation: slideIn 0.25s ease-out both; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <nav class="bg-white shadow sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white text-sm font-bold">PQ</div>
        <span class="font-bold text-xl text-slate-800">Print Queue Manager</span>
      </div>
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
          <input type="checkbox" id="viewCompletedToggle" class="rounded text-indigo-600 focus:ring-indigo-500" />
          Show Today's Completed Jobs
        </label>
        <button id="settingsBtn" class="px-3 py-2 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg hover:bg-slate-200 transition" title="Settings">
          ⚙️
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-3">
      <div>
        <h2 class="text-2xl font-bold text-slate-900">Active Queue</h2>
        <p id="queueCount" class="text-slate-500">0 jobs pending</p>
      </div>

    </div>

    <div id="activeView" class="space-y-3">
      <!-- Active job cards injected here -->
    </div>

    <div id="completedView" class="hidden space-y-3">
      <h3 class="text-lg font-semibold text-slate-700 mb-3">Today's Completed Jobs</h3>
      <div id="completedList" class="space-y-3"></div>
    </div>

    <div id="emptyState" class="hidden text-center py-16">
      <p class="text-slate-400 text-sm">No jobs in queue.</p>
    </div>
  </div>

  <!-- Settings Panel (hidden by default) -->
  <div id="settingsPanel" class="hidden mt-6 bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-lg font-semibold text-slate-900">Settings</h3>
      <button id="closeSettingsBtn" class="text-sm text-slate-500 hover:text-slate-700">✕</button>
    </div>

    <!-- Mute toggle -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
      <span class="text-sm font-medium text-slate-700">Notification Sound</span>
      <button id="muteToggle" class="text-sm text-slate-600 hover:text-indigo-600">🔊 Mute</button>
    </div>

    <!-- Queue pause toggle -->
    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
      <span class="text-sm font-medium text-slate-700">Queue Status</span>
      <button id="pauseQueueBtn" class="px-3 py-1.5 text-sm font-medium bg-green-50 text-green-800 border border-green-200 rounded-lg hover:bg-green-100 transition">
        Queue: Open
      </button>
    </div>

    <!-- UPI Payment Settings -->
    <div class="pt-4 border-t border-slate-100">
      <h3 class="text-lg font-semibold text-slate-900 mb-3">Payment QR Settings</h3>
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm text-slate-600">UPI ID:</span>
        <button id="editUpiBtn" class="text-sm text-indigo-600 hover:text-indigo-700 font-medium">Edit</button>
      </div>
      <div id="upiViewMode" class="flex items-center gap-3">
        <span id="upiIdDisplay" class="font-mono text-sm text-slate-800 bg-slate-50 px-2 py-1 rounded border border-slate-200">shopupi@upi</span>
        <span class="text-xs text-slate-400">Shown on customer token screen</span>
      </div>
      <div id="upiEditMode" class="hidden space-y-3 mt-3">
        <input type="text" id="upiIdInput" placeholder="e.g. shopupi@upi"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        <div class="flex gap-2">
          <button id="saveUpiBtn"
            class="flex-1 px-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
            Save
          </button>
          <button id="cancelUpiBtn"
            class="px-3 py-2 text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition text-sm">
            Cancel
          </button>
        </div>
        <p id="upiSaveMsg" class="text-xs text-green-600 hidden">Saved!</p>
      </div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
